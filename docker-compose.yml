services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: docguard_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: docguard
      POSTGRES_USER: docguard
      POSTGRES_PASSWORD: docguard_dev
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docguard"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
